[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The compatibility floor, not the pinned toolchain (rust-toolchain.toml). `resolver = "3"`
# reads this for MSRV-aware version selection.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Alexander Verbeek <sanderman@gmail.com>"]

[workspace.lints.rust]
# `deny` rather than `forbid`: a hand-written `unsafe impl SystemParam` should be a local
# `#[allow]` with a reason, not a reason to relax this globally.
unsafe_code = "deny"

[workspace.lints.clippy]
manual_let_else = "warn"
undocumented_unsafe_blocks = "warn"

# Note: Use `cargo sort` to keep dependencies somewhat organised.
# First-party crates carry a `version` alongside `path` so a `[patch]` can redirect them later:
# `[patch]` silently does nothing against a bare `path` dependency.
[workspace.dependencies]
avian3d = "0.7.0"
bevy = { version = "0.19.1", default-features = true }
bevy-inspector-egui = { version = "0.37.0", features = ["highlight_changes"] }
bevy_egui = "0.40"
big_space = { git = "https://github.com/aevyrie/big_space", rev = "5f25522", features = ["debug", "camera"] }
egui = "0.34"
egui_dock = "0.19"
ename = { path = "crates/ename", version = "0.0.0" }
ename_content = { path = "crates/ename_content", version = "0.0.0" }
ename_editor = { path = "crates/ename_editor", version = "0.0.0" }
ename_engine = { path = "crates/ename_engine", version = "0.0.0" }
ename_game = { path = "crates/ename_game", version = "0.0.0" }
ename_game_editor = { path = "crates/ename_game_editor", version = "0.0.0" }
serde = "1.0.228"
thiserror = "2.0.18"
toml = "1.1.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
# Bevy's debug info is where the link time goes, and `[profile.dev]` alone does not reach
# dependencies. Costs local-variable inspection in a debugger; keeps file and line in backtraces.
debug = "line-tables-only"
split-debuginfo = "unpacked"
