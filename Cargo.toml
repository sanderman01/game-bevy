[workspace]
resolver = "3"
members = ["ename*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The compatibility floor, not the pinned toolchain (rust-toolchain.toml). `resolver = "3"`
# reads this for MSRV-aware version selection.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Alexander Verbeek <sanderman@gmail.com>"]

[workspace.lints.rust]
# `deny` rather than `forbid`: a hand-written `unsafe impl SystemParam` should be a local
# `#[allow]` with a reason, not a reason to relax this globally.
unsafe_code = "deny"

[workspace.lints.clippy]
manual_let_else = "warn"
undocumented_unsafe_blocks = "warn"

# Note: Use `cargo sort` to keep dependencies somewhat organised.
# First-party crates carry a `version` alongside `path` so a `[patch]` can redirect them later:
# `[patch]` silently does nothing against a bare `path` dependency.
[workspace.dependencies]
anyhow = "1.0.100"
async-lock = "3.4.2"
avian3d = "0.7.0"
bevy = { version = "0.19.1", default-features = true }
bevy-inspector-egui = { version = "0.37.0", features = ["highlight_changes"] }
bevy_egui = "0.40"
big_space = { git = "https://github.com/aevyrie/big_space", rev = "5f25522", features = ["debug", "camera"] }
dirs = "7.0.0"
egui = "0.34"
egui_dock = "0.19"
# `default-features = false` here so `ename_asset_package` can take it without Bevy. Every
# consumer that wants the `alias://` source and the scan plugin asks for `features = ["bevy"]`.
ename_asset_alias = { path = "ename_asset_alias", version = "0.0.0", default-features = false }
ename_asset_content = { path = "ename_asset_content", version = "0.0.0" }
# `default-features = false` here for the same reason as `ename_asset_alias` above:
# `ename_xtask` needs it without Bevy. `ename_asset_content` asks for `features = ["bevy"]`.
ename_asset_package = { path = "ename_asset_package", version = "0.0.0", default-features = false }
ename_editor = { path = "ename_editor", version = "0.0.0" }
ename_engine = { path = "ename_engine", version = "0.0.0" }
ename_game = { path = "ename_game", version = "0.0.0" }
ename_game_editor = { path = "ename_game_editor", version = "0.0.0" }
ename_remote = { path = "ename_remote", version = "0.0.0" }
futures-lite = "2.6.1"
glob = "0.3.4"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.2.0", default-features = false }
schemars = "1.0.4"
semver = { version = "1.0.28", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.145"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.48.0", default-features = false }
toml = "1.1.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.26.0", features = ["serde"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
# Bevy's debug info is where the link time goes, and `[profile.dev]` alone does not reach
# dependencies. Costs local-variable inspection in a debugger; keeps file and line in backtraces.
debug = "line-tables-only"
split-debuginfo = "unpacked"
