
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Alexander Verbeek <sanderman@gmail.com>"]

[workspace.dependencies] # Note: Use `cargo sort` to keep dependencies somewhat organised.
avian3d = "0.7.0"
bevy = { version = "0.19.1", default-features = true, features = ["dynamic_linking", "dev"] }
bevy-inspector-egui = { version = "0.37.0", features = ["highlight_changes"] }
bevy_camera = "0.19.1"
bevy_egui = "0.40"
bevy_input = "0.19.1"
bevy_log = "0.19.1"
bevy_reflect = "0.19.1"
bevy_window = "0.19.1"
big_space = { git = "https://github.com/aevyrie/big_space", rev = "5f25522", features = ["debug", "camera"] }
editor = { path = "editor" }
egui = "0.34"
egui_dock = "0.19"
engine = { path = "engine" }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
toml = "1.1.2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
#codegen-backend = "llvm"
#codegen-backend = "cranelift"
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
#codegen-backend = "llvm"
opt-level = 3
