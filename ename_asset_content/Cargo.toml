[package]
name = "ename_asset_content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# `.zip` and `.tar` mounts under the `Default` source, and their problems in the content report.
zip = ["ename_asset_vfs/zip"]
tar = ["ename_asset_vfs/tar"]

[dependencies]
async-lock.workspace = true
bevy.workspace = true
ename_asset_alias = { workspace = true, features = ["bevy"] }
ename_asset_package = { workspace = true, features = ["bevy"] }
ename_asset_vfs = { workspace = true, features = ["bevy"] }

[dev-dependencies]
# `archive_composition.rs` turns a format on here rather than through this crate's features.
ename_asset_vfs = { workspace = true, features = ["bevy", "zip"] }
# Loader settings in `archive_load.rs`, which a fixture `.meta` sets.
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[[test]]
name = "archive_load"
required-features = ["tar", "zip"]

[lints]
workspace = true
