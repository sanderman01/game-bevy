[package]
name = "example_game_bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["dev"]
# Development-only Bevy features. Must be off for a shipping build.
dev = ["bevy/dynamic_linking", "bevy/dev"]
# The browser build renders through WebGPU; without it, through WebGL2 (`docs/web.md`).
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { workspace = true }
ename_engine = { workspace = true, features = ["tar", "zip"] }
example_game_lib = { workspace = true }

[lints]
workspace = true
