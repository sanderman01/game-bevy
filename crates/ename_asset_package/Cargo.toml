[package]
name = "ename_asset_package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["bevy"]
# `Reflect` on the manifest types, and Bevy's `AssetReader` as a `Vfs` through
# `ename_asset_alias`. Off for a command line tool: `ename_xtask` scans the same tree with
# `StdVfs` and must not link a renderer to do it.
bevy = ["dep:bevy", "ename_asset_alias/bevy"]

[dependencies]
bevy = { workspace = true, optional = true }
ename_asset_alias = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# Drives the scan's futures in tests without going through Bevy, so the test suite does not
# depend on the optional `bevy` feature being on. Already in `Cargo.lock` via Bevy.
futures-lite.workspace = true

[lints]
workspace = true
