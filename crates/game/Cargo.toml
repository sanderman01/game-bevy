[package]
name = "game"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["dev", "editor"]
# Development-only Bevy features. Must be off for a shipping build.
dev = ["bevy/dynamic_linking", "bevy/dev"]
# Links the editor into the binary. Off for a shipping build: absence of the crate is what
# makes "does this ship?" a question the dependency graph answers.
editor = ["dep:editor"]

[dependencies]
avian3d = { workspace = true }
bevy = { workspace = true }
big_space = { workspace = true }
editor = { workspace = true, optional = true }
engine = { workspace = true }
modloader = { workspace = true }

[lints]
workspace = true
