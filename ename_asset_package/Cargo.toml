[package]
name = "ename_asset_package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["bevy"]
# `Resource` on `ContentReport`, and the Bevy half of `ename_asset_alias`.
# Off for a command line tool: `ename_xtask` scans the same tree with `StdVfs` and must not link a
# renderer to do it.
bevy = ["dep:bevy", "ename_asset_alias/bevy"]

[dependencies]
bevy = { workspace = true, optional = true }
ename_asset_alias = { workspace = true }
ename_asset_vfs.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# The archive parity test packs the fixture packages and scans them through `ArchiveVfs`.
ename_asset_vfs = { workspace = true, features = ["tar", "zip"] }
# Drives the scan's futures in tests without going through Bevy, so the test suite does not
# depend on the optional `bevy` feature being on. Already in `Cargo.lock` via Bevy.
futures-lite.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
