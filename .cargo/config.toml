[env]
# Bevy resolves its asset root from BEVY_ASSET_ROOT, else CARGO_MANIFEST_DIR (set by
# `cargo run` to the *package* dir), else the executable dir. Pin it to the workspace
# root so every crate uses the single ./assets directory.
#
# Note: Cargo applies [env] to `cargo run` and `cargo test` only. A binary launched
# directly from target/ falls back to the executable-directory heuristic, which is a
# different asset root. See docs/design.md.
BEVY_ASSET_ROOT = { value = ".", relative = true }
# Local hardware preferences. [env] does not override a variable already set in the
# environment, so CI and other machines can pick their own.
WGPU_BACKEND = "vulkan"
WGPU_ADAPTER_TYPE = "discrete"

# Every alias passes the same feature set as `example_game_editor_bin`'s default features, so
# `cargo build --workspace` and these resolve Bevy the same way and share one copy of it in
# target/. They also save typing out `-p example_game_editor_bin --features ...` for the common
# cases.
[alias]
db = "build --workspace --features example_game_editor_bin/dev"
dr = "run -p example_game_editor_bin --features dev"
dc = "clippy --workspace --all-targets --features example_game_editor_bin/dev"
dt = "test --workspace --features example_game_editor_bin/dev"

# `ename_xtask` links no Bevy, so this does not need the shared `dev`-feature build the aliases
# above do.
xtask = "run -p ename_xtask --"
