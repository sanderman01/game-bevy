<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <!-- No favicon request, so no 404 for it. -->
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; overflow: hidden; }
    body { font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <script type="module">
    const status = document.getElementById("status");
    const needsWebGpu = {{NEEDS_WEBGPU}};
    if (needsWebGpu && !navigator.gpu) {
      status.textContent = "This game needs WebGPU. Use a recent Chrome, Edge, Firefox or Safari.";
    } else {
      // Bevy appends its canvas to the body once the window exists.
      new MutationObserver((_, observer) => {
        if (document.querySelector("canvas")) {
          status.textContent = "";
          observer.disconnect();
        }
      }).observe(document.body, { childList: true });
      import("./{{NAME}}.js").then((module) => module.default({ module_or_path: "./{{NAME}}_bg.wasm" })).catch((error) => {
        // winit unwinds out of the start call on purpose; that one is not a failure.
        if (!String(error).includes("Using exceptions for control flow")) {
          status.textContent = "Failed to start: " + error;
          console.error(error);
        }
      });
    }
  </script>
</body>
</html>
