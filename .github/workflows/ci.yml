name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Proves the dev-only Bevy features are actually gated, and that the editor is compiled
      # out. A shipping build must not contain bevy_dev_tools, the file watcher, a dependency
      # on bevy_dylib, or ename_editor and ename_game_editor.
      - name: Check without default features
        run: cargo check -p ename --no-default-features

      # `ename_asset_package` is the crate `ename_xtask` will link in phase 4, and it has to
      # build with no Bevy in the graph at all. Nothing else in the workspace proves that: every
      # other consumer turns the `bevy` feature on. `--all-targets` covers the test binaries too,
      # which are bevy-free today and should stay that way.
      - name: Check the scanner without Bevy
        run: cargo check -p ename_asset_package --no-default-features --all-targets

      - name: Layer graph
        run: ./scripts/check-layers.sh
