name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Proves the dev-only Bevy features are actually gated: a shipping build must not contain
      # bevy_dev_tools, the file watcher, or a dependency on bevy_dylib. The editor and
      # `ename_remote` are a layer question, not a feature one -- `scripts/check-layers.sh` below
      # is what keeps them out of `example_game_bin`.
      - name: Check without default features
        run: cargo check -p example_game_bin -p example_game_editor_bin --no-default-features

      # The two crates `ename_xtask` will link in phase 4, which have to build with no Bevy in
      # the graph at all. Nothing else in the workspace proves that: every other consumer turns
      # the `bevy` feature on. `--all-targets` covers the test binaries too, so the walk's own
      # tests stay runnable without Bevy.
      - name: Check the alias schema and walk without Bevy
        run: cargo check -p ename_asset_alias --no-default-features --all-targets

      # Per package, in separate invocations: `ename_xtask` turns `zip` and `tar` on, so a
      # workspace-wide build would unify them into every one of these.
      - name: Check the filesystem seam in each feature combination
        run: |
          cargo check -p ename_asset_vfs --no-default-features --all-targets
          cargo check -p ename_asset_vfs --no-default-features --features bevy --all-targets
          cargo check -p ename_asset_vfs --no-default-features --features zip --all-targets
          cargo check -p ename_asset_vfs --no-default-features --features tar --all-targets
          cargo check -p ename_asset_vfs --no-default-features --features zip,tar --all-targets
          cargo check -p ename_asset_vfs --no-default-features --features bevy,zip,tar --all-targets

      - name: Check the package scanner without Bevy
        run: cargo check -p ename_asset_package --no-default-features --all-targets

      - name: Layer graph
        run: ./scripts/check-layers.sh
