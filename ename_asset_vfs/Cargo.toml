[package]
name = "ename_asset_vfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["bevy"]
# Bevy's `AssetReader` as a `Vfs`, and the archive asset source with its write guard. Off for a
# command line tool, which reads through `StdVfs`.
bevy = ["dep:async-channel", "dep:bevy", "dep:blocking"]
# `.zip` mounts. Stored and Deflate members only.
zip = ["dep:crc32fast", "dep:flate2"]
# Plain `.tar` mounts, parsed here: no dependency.
tar = []

[target.'cfg(target_os = "linux")'.dependencies]
# `fadvise` for archive reads. Already in `Cargo.lock` through Bevy and `tempfile`.
rustix = { workspace = true, features = ["fs"] }

[dependencies]
# The watcher's inner channel; Bevy's `AssetSourceEvent` sender is this crate's type.
async-channel = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
blocking = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-lite.workspace = true
# Build archives for the tests.
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true

[[test]]
name = "mounts"
required-features = ["zip", "tar"]

[[test]]
name = "archive_source"
required-features = ["bevy", "zip", "tar"]
