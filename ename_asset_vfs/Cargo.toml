[package]
name = "ename_asset_vfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["bevy"]
# Bevy's `AssetReader` as a `Vfs`. With `zip` or `tar` also on, the archive asset source too.
# Off for a command line tool, which reads through `StdVfs`.
bevy = ["dep:bevy"]
# `.zip` mounts. Stored and Deflate members only.
zip = ["dep:zip", "dep:crc32fast", "dep:flate2", "dep:tracing"]
# Plain `.tar` mounts.
tar = ["dep:tar", "dep:tracing"]

[dependencies]
bevy = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
futures-lite.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "mounts"
required-features = ["zip", "tar"]
