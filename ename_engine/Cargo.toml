[package]
name = "ename_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Video recording through the system `ffmpeg` executable. Off by default: shipping builds
# leave it out.
video = ["dep:libc"]

[target.'cfg(target_os = "linux")'.dependencies]
# `setpriority` for the video encoder's ffmpeg child.
libc = { workspace = true, optional = true }

[dependencies]
avian3d.workspace = true
bevy.workspace = true
big_space.workspace = true
ename_asset_alias.workspace = true
ename_asset_content.workspace = true
image.workspace = true
ron.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# Only for the headless GPU test of the video NV12 shader. Bevy's version, so it unifies.
wgpu = { version = "29.0.3", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }

[lints]
workspace = true
