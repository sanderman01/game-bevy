[package]
name = "example_game_editor_bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["dev", "video"]
# Development-only Bevy features. Must be off for a shipping build.
dev = ["bevy/dynamic_linking", "bevy/dev"]
# Video recording, through the engine. Needs `ffmpeg` on PATH at runtime.
video = ["ename_engine/video"]

[dependencies]
bevy = { workspace = true }
dirs.workspace = true
ename_editor = { workspace = true }
ename_engine = { workspace = true }
ename_remote = { workspace = true }
example_game_lib = { workspace = true }

[lints]
workspace = true
